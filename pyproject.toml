[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sakayos"
version = "0.1.0"
description = "A terminal-based educational Python dashboard that teaches Operating Systems concepts through a Metro Manila commuting analogy."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual",
    "rich",
    "psutil",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
sakayos = "sakayos.app:main"

[tool.setuptools.packages.find]
include = ["sakayos*"]

[tool.setuptools.package-data]
sakayos = ["*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
